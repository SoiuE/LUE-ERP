services:
  mysql:
    image: mysql:8.4
    container_name: lue-erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lue_erp}
      MYSQL_USER: ${MYSQL_USER:-lue_erp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lue_erp_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lue_erp_root_password}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: lue-erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: lue-erp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lue_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lue_minio_password}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  image-search:
    build:
      context: ../image-search
    container_name: lue-erp-image-search
    restart: unless-stopped
    environment:
      IMAGE_SEARCH_INTERNAL_TOKEN: ${LUE_IMAGE_SEARCH_INTERNAL_TOKEN:?LUE_IMAGE_SEARCH_INTERNAL_TOKEN must be set}
      IMAGE_SEARCH_MODEL: ${LUE_IMAGE_SEARCH_MODEL:-ViT-B-32}
      IMAGE_SEARCH_PRETRAINED: ${LUE_IMAGE_SEARCH_PRETRAINED:-laion2b_s34b_b79k}
      IMAGE_SEARCH_INDEX_PATH: /data/image-index.sqlite
      IMAGE_SEARCH_BACKUP_DIR: /backups
      IMAGE_SEARCH_MAX_BYTES: ${LUE_IMAGE_SEARCH_MAX_BYTES:-10485760}
      IMAGE_SEARCH_MAX_PIXELS: ${LUE_IMAGE_SEARCH_MAX_PIXELS:-20000000}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - image_search_data:/data
      - image_search_models:/models
      - image_search_backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  mysql_data:
  redis_data:
  minio_data:
  image_search_data:
  image_search_models:
  image_search_backups:
