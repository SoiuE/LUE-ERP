server:
  port: 8080

spring:
  config:
    import: optional:file:./.env[.properties]
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  application:
    name: lue-erp-backend
  datasource:
    url: ${LUE_DB_URL:jdbc:mysql://localhost:3306/lue_erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${LUE_DB_USERNAME:lue_erp}
    password: ${LUE_DB_PASSWORD:lue_erp_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
  flyway:
    enabled: ${LUE_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  data:
    redis:
      host: ${LUE_REDIS_HOST:localhost}
      port: ${LUE_REDIS_PORT:6379}
      password: ${LUE_REDIS_PASSWORD:}

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: info
    com.lue.erp: debug

lue:
  images:
    storage:
      type: ${LUE_IMAGE_STORAGE_TYPE:none}
      endpoint: ${LUE_MINIO_ENDPOINT:http://localhost:9000}
      bucket: ${LUE_MINIO_BUCKET:lue-erp-images}
      access-key: ${LUE_MINIO_ACCESS_KEY:}
      secret-key: ${LUE_MINIO_SECRET_KEY:}
      region: ${LUE_MINIO_REGION:us-east-1}
    max-file-size: ${LUE_IMAGE_MAX_FILE_SIZE:10485760}
    max-pixels: ${LUE_IMAGE_MAX_PIXELS:20000000}
    max-dimension: ${LUE_IMAGE_MAX_DIMENSION:8000}
    archive:
      connect-timeout-ms: ${LUE_IMAGE_ARCHIVE_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${LUE_IMAGE_ARCHIVE_READ_TIMEOUT_MS:7000}
      call-timeout-ms: ${LUE_IMAGE_ARCHIVE_CALL_TIMEOUT_MS:12000}
      max-file-size: ${LUE_IMAGE_ARCHIVE_MAX_FILE_SIZE:10485760}
      max-redirects: ${LUE_IMAGE_ARCHIVE_MAX_REDIRECTS:3}
      worker-count: ${LUE_IMAGE_ARCHIVE_WORKERS:2}
      queue-capacity: ${LUE_IMAGE_ARCHIVE_QUEUE_CAPACITY:20}
      poll-delay-ms: ${LUE_IMAGE_ARCHIVE_POLL_DELAY_MS:3000}
    search:
      url: ${LUE_IMAGE_SEARCH_URL:http://127.0.0.1:8090}
      internal-token: ${LUE_IMAGE_SEARCH_INTERNAL_TOKEN:}
      connect-timeout-ms: ${LUE_IMAGE_SEARCH_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${LUE_IMAGE_SEARCH_READ_TIMEOUT_MS:15000}
      index-poll-delay-ms: ${LUE_IMAGE_INDEX_POLL_DELAY_MS:3000}
      minimum-score: ${LUE_IMAGE_SEARCH_MINIMUM_SCORE:0.20}
      include-packaging: ${LUE_IMAGE_SEARCH_INCLUDE_PACKAGING:false}
  legacy-migration:
    rehearsal-enabled: ${LUE_LEGACY_MIGRATION_REHEARSAL_ENABLED:false}
  auth:
    secret: ${LUE_AUTH_SECRET:local-development-secret-change-before-deploy-32chars}
    token-hours: ${LUE_AUTH_TOKEN_HOURS:12}
  bootstrap:
    admin-username: ${LUE_ADMIN_USERNAME:admin}
    admin-password: ${LUE_ADMIN_PASSWORD:ChangeMe123!}
